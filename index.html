<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Product preview card component</title>
  <link rel="stylesheet" href="style.css">

</head>
<body>
<main class="tarjeta">

  <section class="tarjeta_seccion1">
    <img  class="tarjeta_seccion1__imagen" src="./images/image-product-mobile.jpg" alt="Perfume">  
  </section>

  <section class="tarjeta_seccion2">
   <p class="tarjeta_seccion2__producto">Perfume</p>
   <h2 class="tarjeta_seccion2__producto-titulo">Gabrielle Essence Eau De Parfum</h2>
   <p class="tarjeta_seccion2__producto-descripcion">A floral, solar and voluptuous interpretation composed by Olivier Polge, 
    Perfumer-Creator for the House of CHANEL.</p>
    <div class="tarjeta_seccion2__producto-precios">
      <p class="tarjeta_seccion2__producto-precio-oferta">$149.99</p>
      <p class="tarjeta_seccion2__producto-precio-original">$169.99</p>
    </div>
    <button type="button" class="tarjeta_seccion2-button-card">
      <img class="tarjeta_seccion2-button-icon" src="./images/icon-cart.svg" alt="icono">Add to Cart</button>
  </section>

</main>
  
</body>
</html>
